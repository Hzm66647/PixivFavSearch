<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PixivFavSearch - Git 分支全图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; overflow: hidden; }
#canvas { width: 100vw; height: 100vh; display: block; }
#tooltip { position: absolute; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.6; pointer-events: none; display: none; max-width: 380px; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
.tt-title { color: #58a6ff; font-weight: bold; margin-bottom: 4px; }
.tt-hash { color: #79c0ff; font-family: 'Consolas', monospace; }
.tt-ref { display: inline-block; background: #21262d; color: #e6edf3; padding: 1px 6px; border-radius: 4px; font-size: 11px; margin-right: 3px; margin-top: 3px; }
.tt-ref.master { background: #1f6feb; color: #fff; }
.tt-ref.feat { background: #8957e5; color: #fff; }
.tt-ref.tag { background: #1a7f37; color: #fff; }
#legend { position: absolute; bottom: 16px; left: 16px; background: #161b22ee; border: 1px solid #30363d; border-radius: 8px; padding: 10px 14px; font-size: 11px; }
#legend div { margin: 2px 0; }
#legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
#info { position: absolute; top: 12px; right: 16px; color: #8b949e; font-size: 11px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="tooltip"></div>
<div id="legend">
  <div><span style="background:#1f6feb"></span>master (稳定版)</div>
  <div><span style="background:#8957e5"></span>feat-plugin-system (插件系统测试版)</div>
</div>
<div id="info">滚轮缩放 · 拖拽平移</div>
<script>
// === 数据 ===
const commits = [
  // feat-plugin-system 分支 (不合并到 master)
  { hash: 'cde6957', short: 'cde6957', msg: 'fix: 删除重复的go()和switchModeNoGo()函数定义', parents: ['0fa64ea'], branch: 'feat-plugin-system', refs: ['feat-plugin-system'] },
  { hash: '0fa64ea', short: '0fa64ea', msg: 'feat: add plugin market, drag-drop .plug install, remote server support', parents: ['5c621dc'], branch: 'feat-plugin-system', refs: ['tag: v0.3.0-plugin-market'] },
  { hash: '5c621dc', short: '5c621dc', msg: 'feat: 插件系统 - 可插拔数据源管理', parents: ['20f8f56'], branch: 'feat-plugin-system', refs: ['tag: v0.2.0-plugin-beta'] },
  // master 主分支 (干净稳定版)
  { hash: '20f8f56', short: '20f8f56', msg: 'Merge branch feat-full-diag-log', parents: [], branch: 'master', refs: ['HEAD -> master', 'tag: v0.1.9-delta', 'origin/master'] },
];

// === 布局计算 ===
const branchOrder = ['master', 'feat-plugin-system'];
const branchColors = {
  'master': '#1f6feb',
  'feat-plugin-system': '#8957e5',
};

const commitMap = {};
commits.forEach((c, i) => commitMap[c.hash] = c);

// 分配 row (按从上到下时间排序)
// master 在最上面，feat-plugin-system 从 master 分支出来
commits.forEach((c, i) => {
  if (c.branch === 'master') c.row = 0;
  else if (c.hash === '5c621dc') c.row = 0;
  else if (c.hash === '0fa64ea') c.row = 1;
  else if (c.hash === 'cde6957') c.row = 2;
});

// 分配 column (branch lane)
const branchCol = {};
branchOrder.forEach((b, i) => { branchCol[b] = i; });
commits.forEach(c => { c.col = branchCol[c.branch] !== undefined ? branchCol[c.branch] : 1; });

// === Canvas ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let W, H, dpr;
let scale = 1, offsetX = 0, offsetY = 0;
let dragging = false, lastX = 0, lastY = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// 布局参数
const NODE_R = 7;
const LANE_W = 80;
const ROW_H = 50;
const LEFT_PAD = 80;
const TOP_PAD = 80;

function getXY(commit) {
  const x = LEFT_PAD + commit.col * LANE_W;
  const y = TOP_PAD + commit.row * ROW_H;
  return { x, y };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // 画分支线
  commits.forEach(c => {
    const color = branchColors[c.branch] || '#30363d';
    c.parents.forEach(ph => {
      const p = commitMap[ph];
      if (!p) return;
      const from = getXY(c);
      const to = getXY(p);
      
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      
      if (from.col === to.col) {
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
      } else {
        const midY = (from.y + to.y) / 2;
        ctx.moveTo(from.x, from.y);
        ctx.bezierCurveTo(from.x, midY, to.x, midY, to.x, to.y);
      }
      ctx.stroke();
    });
  });

  // 画节点
  commits.forEach(c => {
    const { x, y } = getXY(c);
    const color = branchColors[c.branch] || '#30363d';
    
    ctx.beginPath();
    ctx.arc(x, y, NODE_R, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 标签文字
    ctx.font = '12px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#e6edf3';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(c.short, x + NODE_R + 10, y - 7);
    
    ctx.font = '11px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#8b949e';
    let msg = c.msg;
    if (msg.length > 50) msg = msg.substring(0, 49) + '…';
    ctx.fillText(msg, x + NODE_R + 10, y + 8);
    
    // refs
    let refX = x + NODE_R + 10 + ctx.measureText(msg).width + 15;
    c.refs.forEach(ref => {
      let cls = '';
      if (ref.includes('master')) cls = 'master';
      else if (ref.includes('feat-')) cls = 'feat';
      else if (ref.includes('tag:')) cls = 'tag';
      else if (ref.includes('HEAD')) cls = 'master';
      
      let label = ref;
      if (label.includes('tag: ')) label = '🏷' + label.replace('tag: ', '');
      if (label.includes('origin/')) label = label.replace('origin/', '');
      if (label.includes('HEAD -> ')) label = 'HEAD';
      
      ctx.font = '10px Consolas, monospace';
      const lw = ctx.measureText(label).width + 8;
      if (refX + lw < 1800) {
        ctx.fillStyle = cls === 'master' ? '#1f6feb' : cls === 'feat' ? '#8957e5' : cls === 'tag' ? '#1a7f37' : '#30363d';
        ctx.beginPath();
        ctx.roundRect(refX, y - 7, lw, 14, 3);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(label, refX + 4, y + 1);
        refX += lw + 4;
      }
    });
  });

  // 画分支标签 (左侧)
  ctx.font = 'bold 11px "Segoe UI", sans-serif';
  ctx.textAlign = 'right';
  branchOrder.forEach(b => {
    const col = branchCol[b];
    const x = LEFT_PAD + col * LANE_W;
    const commitsInLane = commits.filter(c => c.branch === b);
    if (commitsInLane.length === 0) return;
    const avgRow = commitsInLane.reduce((s,c) => s + c.row, 0) / commitsInLane.length;
    const y = TOP_PAD + avgRow * ROW_H;
    ctx.fillStyle = branchColors[b];
    ctx.fillText(b, x - 12, y);
  });

  ctx.restore();
}

// === 交互 ===
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (dragging) {
    offsetX += e.clientX - lastX;
    offsetY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    draw();
  } else {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left - offsetX) / scale;
    const my = (e.clientY - rect.top - offsetY) / scale;
    let hovered = null;
    commits.forEach(c => {
      const { x, y } = getXY(c);
      const dx = mx - x, dy = my - y;
      if (dx * dx + dy * dy < 169) hovered = c;
    });
    if (hovered) {
      let refsHtml = hovered.refs.map(r => {
        let cls = '';
        if (r.includes('master')) cls = 'master';
        else if (r.includes('feat-')) cls = 'feat';
        else if (r.includes('tag:')) cls = 'tag';
        return `<span class="tt-ref ${cls}">${r}</span>`;
      }).join('');
      tooltip.innerHTML = `<div class="tt-title">${hovered.msg}</div><div class="tt-hash">${hovered.hash}</div>${refsHtml}`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY + 16) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  }
});
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => { dragging = false; tooltip.style.display = 'none'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  offsetX = mx - (mx - offsetX) * delta;
  offsetY = my - (my - offsetY) * delta;
  scale = Math.max(0.3, Math.min(3, scale * delta));
  draw();
}, { passive: false });

// 自动居中
scale = 1;
offsetX = 40;
offsetY = 20;
draw();
</script>
</body>
</html>
